{% load static %}
<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}법률사무소 시민 | 개인회생 · 파산 · 민형사 · 가사 · 이혼 전문{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}법률사무소 시민 - 개인회생, 파산, 민형사, 가사, 이혼 전문 법률사무소. 무료 상담 031-438-2585{% endblock %}">
  <meta name="keywords" content="법률사무소, 개인회생, 파산, 민형사, 가사, 이혼, 법인회생, 안산, 무료상담, 법률상담, 채무조정">

  <!-- Open Graph -->
  <meta property="og:title" content="{% block og_title %}법률사무소 시민 - 당신의 답이 되는 법률 파트너{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:description" content="개인회생·파산·민형사·가사·이혼 전문. 무료 상담 031-438-2585">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="법률사무소 시민">

  <!-- Canonical -->
  <link rel="canonical" href="{{ request.build_absolute_uri }}">

  <link rel="icon" href="{% static 'img/favicon.ico' %}" sizes="any">
  <meta name="theme-color" content="#1E3A5F">

  <!-- Naver 웹마스터 도구 (등록 시 사용) -->
  {% block meta_verification %}{% endblock %}

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}

  <!-- 구조화 데이터 (JSON-LD) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LegalService",
    "name": "법률사무소 시민",
    "description": "개인회생, 파산, 민형사, 가사, 이혼 전문 법률사무소",
    "url": "{{ request.scheme }}://{{ request.get_host }}",
    "telephone": "031-438-2585",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "이동 715",
      "addressLocality": "안산시 상록구",
      "addressRegion": "경기도",
      "addressCountry": "KR"
    },
    "openingHours": "Mo-Fr 09:00-18:00",
    "areaServed": {
      "@type": "City",
      "name": "안산시"
    },
    "priceRange": "무료 상담 가능",
    "knowsAbout": ["개인회생", "개인파산", "민사소송", "형사사건", "이혼소송", "법인회생"]
  }
  </script>
  {% block extra_jsonld %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  {% block extra_js %}{% endblock %}
</body>

</html>
